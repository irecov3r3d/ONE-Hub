<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Assistant Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #0066cc;
    }
    #status {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Gemini Assistant Configuration</h1>

  <div class="form-group">
    <label for="apiKey">Gemini API Key</label>
    <input type="text" id="apiKey" placeholder="Enter your Gemini API key...">
    <p style="font-size: 0.8rem; color: #666;">You can get an API key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.</p>
  </div>

  <div class="form-group">
    <label for="modelSelect">Gemini Model</label>
    <select id="modelSelect">
      <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fast & Free-ish)</option>
      <option value="gemini-1.5-pro">Gemini 1.5 Pro (Powerful & Slower)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="customInstructions">Custom Instructions (System Prompt)</label>
    <textarea id="customInstructions" placeholder="e.g. Always respond in bullet points, focus on technical details..."></textarea>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="scripts/options.js"></script>
</body>
</html>
