<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONE-Hub AI Bridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
    }

    .status-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #aaa;
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.connected {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-dot.disconnected {
      background: #f87171;
    }

    .status-dot.pending {
      background: #fbbf24;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .tabs-list {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .tab-item:last-child {
      border-bottom: none;
    }

    .tab-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .tab-info {
      flex: 1;
    }

    .tab-name {
      font-size: 13px;
      font-weight: 500;
    }

    .tab-url {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .tab-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #666;
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <div class="title">ONE-Hub AI Bridge</div>
      <div class="subtitle">Multi-Tab Automation</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Connection</span>
      <span class="status-value">
        <span class="status-dot" id="connectionDot"></span>
        <span id="connectionStatus">Checking...</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Active Tabs</span>
      <span class="status-value" id="activeTabCount">0</span>
    </div>
  </div>

  <div class="section-title">Registered Tabs</div>
  <div class="tabs-list" id="tabsList">
    <div class="empty-state">
      <div class="empty-state-icon">📑</div>
      <div>No tabs registered</div>
    </div>
  </div>

  <button class="btn btn-primary" id="openAppBtn">
    Open ONE-Hub
  </button>

  <button class="btn btn-secondary" id="refreshBtn">
    Refresh Status
  </button>

  <div class="footer">
    <a href="https://github.com/one-hub" target="_blank">GitHub</a> · v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
